<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Notification</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-md overflow-hidden">
        <!-- Header -->
        <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
            <h2 class="font-semibold text-gray-900">Thông báo</h2>
            <button class="text-gray-500 hover:text-gray-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>

        <!-- Notification Item -->
        <div class="flex items-start gap-3 p-3 hover:bg-gray-50 cursor-pointer border-b border-gray-100">
            <!-- Avatar -->
            <img src="https://i.pravatar.cc/100?img=1" alt="Avatar" class="w-12 h-12 rounded-full object-cover flex-shrink-0">

            <!-- Content -->
            <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2">
                    <p class="text-sm text-gray-900 leading-snug">
                        <span class="font-semibold hover:underline cursor-pointer">Cong Thanh 1</span>
                        <span class="text-gray-900"> đã bình luận về bài viết của bạn</span>
                    </p>
                    <span class="text-[10px] text-gray-400 flex-shrink-0">2 phút trước</span>
                </div>
                <p class="text-sm text-gray-600 mt-0.5 truncate leading-snug">nnn</p>
            </div>
        </div>

        <!-- Another Notification Item (Unread) -->
        <div class="flex items-start gap-3 p-3 bg-blue-50 hover:bg-blue-100 cursor-pointer border-b border-gray-100">
            <!-- Avatar -->
            <img src="https://i.pravatar.cc/100?img=5" alt="Avatar" class="w-12 h-12 rounded-full object-cover flex-shrink-0">

            <!-- Content -->
            <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2">
                    <p class="text-sm text-gray-900 leading-snug">
                        <span class="font-semibold hover:underline cursor-pointer">Nguyễn Văn A</span>
                        <span class="text-gray-900"> đã thích bài viết của bạn</span>
                    </p>
                    <span class="text-[10px] text-gray-400 flex-shrink-0">5 phút trước</span>
                </div>
                <div class="flex items-center gap-2 mt-1">
                    <span class="w-1 h-1 bg-blue-500 rounded-full"></span>
                    <p class="text-sm text-gray-600 truncate leading-snug">Nhìn thật đẹp quá!</p>
                </div>
            </div>
            <!-- Unread Indicator -->
            <div class="w-2 h-2 bg-blue-500 rounded-full flex-shrink-0 mt-1"></div>
        </div>

        <!-- Another Notification Item -->
        <div class="flex items-start gap-3 p-3 hover:bg-gray-50 cursor-pointer border-b border-gray-100">
            <!-- Avatar -->
            <img src="https://i.pravatar.cc/100?img=8" alt="Avatar" class="w-12 h-12 rounded-full object-cover flex-shrink-0">

            <!-- Content -->
            <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2">
                    <p class="text-sm text-gray-900 leading-snug">
                        <span class="font-semibold hover:underline cursor-pointer">Trần Thị B</span>
                        <span class="text-gray-900"> và </span>
                        <span class="font-semibold hover:underline cursor-pointer">2 người khác</span>
                        <span class="text-gray-900"> đã chia sẻ bài viết của bạn</span>
                    </p>
                    <span class="text-[10px] text-gray-400 flex-shrink-0">1 giờ trước</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="px-4 py-3 text-center">
            <button class="text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-100 px-4 py-2 rounded-md">
                Đánh dấu tất cả là đã đọc
            </button>
        </div>
    </div>
</body>
</html>
